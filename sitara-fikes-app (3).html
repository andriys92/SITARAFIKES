<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SITARA FIKES</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href='data:application/json,{"name":"SITARA FIKES","short_name":"SITARA","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#0B2A5B"}'>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
#app{position:fixed;inset:0;z-index:999999;background:#F4F7FC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F1F3D;display:flex;overflow:hidden;font-size:14px}
.side{width:240px;background:linear-gradient(#0B2A5B,#0A2350);color:#fff;display:flex;flex-direction:column;padding:16px 12px;overflow:auto;flex-shrink:0}
.side img{width:110px;margin:0 auto 14px;background:#fff;border-radius:18px;padding:6px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:500;opacity:.88;transition:.2s}
.nav:hover{background:rgba(255,255,255,.1)}.nav.on{background:#2F6FDE;opacity:1}
.main{flex:1;overflow:auto;padding:20px 24px}
.card{background:#fff;border:1px solid #E6ECF5;border-radius:16px;box-shadow:0 4px 20px rgba(15,61,145,.06);padding:16px}
.glass{background:rgba(255,255,255,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero{background:linear-gradient(120deg,#0F3D91,#1E5BC6);color:#fff;border-radius:20px;padding:28px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.sc{display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}.sc:hover{transform:translateY(-2px)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:#F4F7FC;border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat small,small{color:#5B6B85}
.act{padding:8px 0;border-bottom:1px solid #EEF2F8}.em{text-align:center;color:#94A3B8;padding:24px}
.btn{background:#2F6FDE;color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.w{background:#fff;color:#0B2A5B}.btn.g{background:#EEF3FB;color:#0B2A5B}.btn.r{background:#FEE2E2;color:#B91C1C}.btn.s{padding:5px 12px;font-size:12px}
input,select{width:100%;padding:10px 12px;border:1px solid #D7E0EE;border-radius:12px;font:inherit;background:#fff}
.lb{display:block;margin-bottom:10px;font-weight:700;font-size:12px}.lb input,.lb select{margin-top:4px;font-weight:400;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #EEF2F8;white-space:nowrap}th{color:#5B6B85}.tw{overflow:auto}
.chip{background:#FEF3C7;color:#92400E;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input{width:220px}
.modal{position:fixed;inset:0;background:rgba(10,35,80,.4);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:1000000;padding:16px}
.modal .card{width:100%;max-width:480px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0B2A5B;color:#fff;padding:10px 20px;border-radius:999px;z-index:1000001}
.lg{margin:auto;padding:16px;width:100%;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#DCE8FF,#fff 60%);height:100%;overflow:auto}
.lg input{margin-bottom:10px}.bn{display:none}
@media(max-width:800px){.side{display:none}.main{padding:14px 14px 100px}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}
.bn{display:flex;position:fixed;left:12px;right:12px;bottom:12px;border-radius:20px;padding:8px;justify-content:space-around;z-index:4}
.bn div{text-align:center;font-size:11px;padding:4px 8px;border-radius:12px;cursor:pointer}.bn div.on{background:#2F6FDE;color:#fff}.bn span{display:block;font-size:18px}}
/* ===== RESPONSIF SEMUA LAYAR ===== */
.main>*{max-width:1500px;margin-left:auto;margin-right:auto}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr))}
.sc b,.stat small{min-width:0;overflow-wrap:anywhere}.tw{-webkit-overflow-scrolling:touch}
@media(min-width:1600px){#app{font-size:15px}.side{width:260px}}
@media(max-width:1100px){.side{width:200px}.main{padding:18px}}
@media(max-width:800px){
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.bn{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
input,select{font-size:16px}
.bar{gap:8px}.bar .row{width:100%;flex-wrap:wrap}.bar .row input,.bar .row select{flex:1 1 140px;width:auto!important;min-width:0}.bar .row .btn{flex-shrink:0}}
@media(max-width:600px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc{padding:10px;gap:8px}.ic{width:38px;height:38px;font-size:18px}.sc b{font-size:13px}
.main{padding:12px 12px calc(100px + env(safe-area-inset-bottom,0px))}
.card{padding:14px}.top{padding:12px 14px;gap:8px}.top h1{font-size:20px}
.top>div:first-child>small:first-child{display:none}
.top>.row{width:100%;gap:8px 10px}
.top>.row>.chip{order:1;font-size:11px;padding:3px 10px}.top>.row>#bell{order:1}
.top>.row>[data-p="profil"]{order:2;margin-left:auto;padding-left:0!important;border-left:0!important;min-width:0}
.top #pn{max-width:min(340px,38vw)!important}
.top>.row>div[style*="text-align"]{order:3;flex:1 1 100%;text-align:left!important}
.top>.row>div[style*="text-align"] br{display:none}.top>.row>div[style*="text-align"] small{margin-left:6px}
.hero{padding:20px}.hero h1{font-size:24px!important}th,td{padding:8px}}
@media(max-width:360px){.bn div{padding:4px;font-size:10px}.grid2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>

const DB={
 async list(t){if(IS_PREVIEW)return[...mem[t]].reverse();const{data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});if(error)throw error;return data},
 async add(t,r){if(IS_PREVIEW){mem[t].push({id:uid(),created_at:new Date().toISOString(),...r});return}const{error}=await sb.from(t).insert(r);if(error)throw error},

 async del(t,id){if(IS_PREVIEW){mem[t]=mem[t].filter(x=>x.id!==id);return}const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error},

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function up(f){if(!f)return'';if(IS_PREVIEW)return'#'+f.name;const p=Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');const{error}=await sb.storage.from('arsip').upload(p,f);if(error)throw error;return sb.storage.from('arsip').getPublicUrl(p).data.publicUrl}

 <nav class="bn card glass">${[['dashboard','🏠','Beranda'],['surat_masuk','📥','Surat'],['arsip','🗄️','Arsip'],['laporan','📊','Laporan']].map(x=>`<div class="${S.page===x[0]?'on':''}" data-p="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('')}<div id="more"><span>☰</span>Lainnya</div></nav>`;
 fitName();tick();$('#out').onclick=logout;$('#bell').onclick=()=>isA()?go('log'):toast('Tidak ada notifikasi baru');
 $('#more').onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${n.concat([['profil','👤','Profil Pengguna']]).map(x=>`<div class="nav" style="color:#0F1F3D" data-p="${x[0]}">${x[1]} ${x[2]}</div>`).join('')}<div class="nav" style="color:#B91C1C" id="o2">🚪 Keluar</div></div>`;m.onclick=e=>{const p=e.target.closest('[data-p]');if(p){m.remove();go(p.dataset.p)}else if(e.target===m||e.target.closest('#o2'))m.remove()};m.querySelector('#o2').onclick=logout;document.body.appendChild(m)}}
const PG={dashboard:pgDash,arsip:pgArsip,laporan:pgLap,pengguna:pgUser,pengaturan:pgSet,log:pgLog,profil:pgProf};
async function go(p){if(p!==S.page)S.q='';S.page=p;shell();try{await(PG[p]?PG[p]():pgDoc(p))}catch(e){$('#pg').innerHTML=`<div class="card em">Gagal memuat: ${esc(e.message)}</div>`}}
const reload=()=>(PG[S.page]||(()=>pgDoc(S.page)))();
const ws=s=>String(s||'').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
const hit=(txt,q)=>{const w=ws(txt);return ws(q).every(k=>w.some(x=>x.startsWith(k)))};
const txt=r=>[r.nomor,r.tanggal,r.pihak,r.perihal,r.jenis,r.berakhir].join(' ');
function applyQ(){let n=0;document.querySelectorAll('#pg tr[data-s]').forEach(tr=>{const ok=hit(tr.dataset.s,S.q);tr.style.display=ok?'':'none';if(ok)n++});const e=$('#nores');if(e)e.style.display=n?'none':''}
function search(){const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;applyQ()}}
// ===== HALAMAN =====
async function pgDash(){
 const all=await allDocs(),cnt=t=>all.filter(r=>r._t===t).length;
 const rec=[...all].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,5);
 $('#pg').innerHTML=`<div class="hero"><small style="color:#DCE8FF">Selamat Datang di</small><h1 style="font-size:30px;font-weight:800">Aplikasi ${esc(S.cfg.app)}</h1><p style="margin:6px 0 16px">Kelola surat, dokumen, dan arsip secara digital, lebih cepat, mudah, dan terintegrasi.</p><button class="btn w" data-p="arsip">Mulai Menggunakan →</button></div>
 <div class="grid">${navItems().filter(n=>n[0]!=='dashboard').map(n=>`<div class="card sc" data-p="${n[0]}"><div class="ic" style="background:${(MODS[n[0]]||{c:'#DCE8FF'}).c}">${n[1]}</div><b>${n[2]}</b></div>`).join('')}</div>
 <div class="two"><div class="card"><h3>Ringkasan Sistem</h3><div class="grid2">${Object.keys(MODS).map(t=>`<div class="stat"><b>${cnt(t)}</b><small>${MODS[t].t}</small></div>`).join('')}<div class="stat"><b>${all.length}</b><small>Total Arsip Digital</small></div></div></div>
 <div class="card"><h3>Aktivitas Terbaru</h3>${rec.length?rec.map(r=>`<div class="act"><b>${MODS[r._t].t}</b>: ${esc(r.perihal||r.nomor)}<br><small>${esc(r.nomor)} · ${esc((r.created_at||'').slice(0,10))}</small></div>`).join(''):'<p class="em">Belum ada data</p>'}</div></div>`}
function docForm(t,row){
 const M=MODS[t],fs=[{k:'nomor',l:'Nomor'},{k:'tanggal',l:'Tanggal',type:'date'},{k:'pihak',l:M.pihak},{k:'perihal',l:'Perihal / Tentang'}];
 if(M.jenis)fs.push({k:'jenis',l:'Jenis',type:'select',o:M.jenis},{k:'berakhir',l:'Tanggal Berakhir',type:'date'});
 fs.push({k:'file',l:'Dokumen (PDF/gambar)',type:'file'});
 openForm((row?'Ubah ':'Tambah ')+M.t,fs,row||{},async r=>{
  if(!r.nomor||!r.tanggal)throw new Error('Nomor dan tanggal wajib diisi');
  const f=r.file;delete r.file;if(f)r.file_url=await up(f);r.berakhir=r.berakhir||null;
  if(row)await DB.upd(t,row.id,r);else{r.created_by=S.user.nama;await DB.add(t,r)}
  await lg(row?'Ubah':'Tambah',M.t,r.nomor);toast('Tersimpan');go(t)})}
async function pgDoc(t){
 const M=MODS[t],rows=await DB.list(t);
 $('#pg').innerHTML=`<div class="bar"><h2>${M.t}</h2><div class="row"><input id="q" placeholder="Cari..." value="${esc(S.q)}">${canW()?'<button class="btn" id="add">+ Tambah</button>':''}</div></div><div class="card">${tbl(['Nomor','Tanggal',M.pihak,'Perihal',...(M.jenis?['Jenis','Berakhir']:[]),'Dokumen','Aksi'],rows.map(r=>`<tr data-s="${esc(txt(r))}"><td>${esc(r.nomor)}</td><td>${esc(r.tanggal)}</td><td>${esc(r.pihak)}</td><td>${esc(r.perihal)}</td>${M.jenis?`<td>${esc(r.jenis)}</td><td>${esc(r.berakhir)}</td>`:''}<td>${fl(r)}</td><td>${canW()?`<button class="btn g s" data-e="${r.id}">Ubah</button> `:''}${canD()?`<button class="btn r s" data-d="${r.id}">Hapus</button>`:''}</td></tr>`))}<p class="em" id="nores" style="display:none">Tidak ditemukan</p></div>`;
 search();applyQ();if($('#add'))$('#add').onclick=()=>docForm(t);
 $('#pg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const r=rows.find(x=>x.id===(b.dataset.e||b.dataset.d));if(!r)return;
  if(b.dataset.e)docForm(t,r);else if(confirm('Hapus data ini?')){try{await DB.del(t,r.id);await lg('Hapus',M.t,r.nomor);toast('Dihapus');go(t)}catch(x){toast('Gagal: '+x.message)}}}}
async function pgArsip(){
 const all=await allDocs(),j=S.j||'',q=S.q.toLowerCase();
 const rows=all.filter(r=>(!j||r._t===j)).sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
 $('#pg').innerHTML=`<div class="bar"><h2>Arsip Digital</h2><div class="row"><select id="j" style="width:190px"><option value="">Semua Jenis</option>${Object.entries(MODS).map(([k,m])=>`<option value="${k}" ${j===k?'selected':''}>${m.t}</option>`).join('')}</select><input id="q" placeholder="Cari nomor / perihal..." value="${esc(S.q)}"></div></div><div class="card">${tbl(['Jenis','Nomor','Tanggal','Perihal','Dokumen'],rows.map(r=>`<tr data-s="${esc(txt(r)+' '+MODS[r._t].t)}"><td>${MODS[r._t].i} ${MODS[r._t].t}</td><td>${esc(r.nomor)}</td><td>${esc(r.tanggal)}</td><td>${esc(r.perihal)}</td><td>${fl(r)}</td></tr>`))}<p class="em" id="nores" style="display:none">Tidak ditemukan</p></div>`;
 search();applyQ();$('#j').onchange=e=>{S.j=e.target.value;reload()}}
async function pgLap(){
 const all=await allDocs(),yrs=[...new Set(all.map(r=>(r.tanggal||'').slice(0,4)).filter(Boolean))].sort().reverse(),y=S.yr||yrs[0]||String(new Date().getFullYear());
 const of=all.filter(r=>(r.tanggal||'').startsWith(y)),bl=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
 const rows=Object.keys(MODS).map(t=>{const c=bl.map((_,i)=>of.filter(r=>r._t===t&&+r.tanggal.slice(5,7)===i+1).length);return`<tr><td>${MODS[t].t}</td>${c.map(x=>`<td>${x}</td>`).join('')}<td><b>${c.reduce((a,b)=>a+b,0)}</b></td></tr>`});
 $('#pg').innerHTML=`<div class="bar"><h2>Laporan</h2><div class="row"><select id="yr" style="width:120px">${(yrs.length?yrs:[y]).map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select><button class="btn" id="csv">Unduh Excel (.xlsx)</button></div></div><div class="card">${tbl(['Jenis',...bl,'Total'],rows)}</div>`;
 $('#yr').onchange=e=>{S.yr=e.target.value;reload()};
 $('#csv').onclick=()=>{if(window.XLSX)return xlsx(of,bl,y);const c=[['Jenis','Nomor','Tanggal','Pihak','Perihal']].concat(of.map(r=>[MODS[r._t].t,r.nomor,r.tanggal,r.pihak,r.perihal])).map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeffsep=,\n'+c],{type:'text/csv'}));a.download=`laporan-sitara-${y}.csv`;a.click()}}
async function pgUser(){
 const rows=await DB.list('pengguna');
 $('#pg').innerHTML=`<div class="bar"><h2>Manajemen Pengguna</h2><button class="btn" id="add">+ Tambah Pengguna</button></div><div class="card">${tbl(['Foto','Nama Lengkap & Gelar','Username','Peran','Unit Kerja','Jabatan','Aktif','Aksi'],rows.map(r=>`<tr><td>${av(r)}</td><td>${esc(r.nama_lengkap||r.nama)}</td><td>${esc(r.username)}</td><td>${esc(r.role)}</td><td>${esc(r.unit_kerja)}</td><td>${esc(r.jabatan)}</td><td>${r.aktif?'Ya':'Tidak'}</td><td><button class="btn g s" data-e="${r.id}">Ubah</button> <button class="btn r s" data-d="${r.id}">Hapus</button></td></tr>`))}</div>`;
 const form=row=>openForm(row?'Ubah Pengguna':'Tambah Pengguna',[{k:'nama',l:'Nama Tampilan'},{k:'nama_lengkap',l:'Nama Lengkap beserta Gelar'},{k:'username',l:'Username'},{k:'password',l:row?'Password (kosongkan jika tidak diubah)':'Password',type:'password'},{k:'role',l:'Peran',type:'select',o:['staf','prodi','pimpinan']},{k:'jabatan',l:'Jabatan / Prodi'},{k:'unit_kerja',l:'Unit Kerja'},{k:'aktif',l:'Aktif',type:'select',o:['Ya','Tidak']},{k:'foto',l:'Foto Profil (JPG/PNG)',type:'file',acc:'image/*'}],row?{...row,password:'',aktif:row.aktif?'Ya':'Tidak'}:{},async r=>{
  if(!r.nama||!r.nama_lengkap||!r.unit_kerja||!r.username||(!row&&!r.password))throw new Error('Nama, nama lengkap & gelar, unit kerja, username, dan password wajib diisi');
  const d={nama:r.nama,nama_lengkap:r.nama_lengkap,unit_kerja:r.unit_kerja,username:r.username,role:r.role,jabatan:r.jabatan,aktif:r.aktif==='Ya'};if(r.password)d.password_hash=await sha(r.password);if(r.foto)d.foto_url=await upFoto(r.foto);
  if(row)await DB.upd('pengguna',row.id,d);else await DB.add('pengguna',d);
  await lg(row?'Ubah':'Tambah','Pengguna',r.username);if(row&&row.id===S.user.id)Object.assign(S.user,d);toast('Tersimpan');go('pengguna')});
 $('#add').onclick=()=>form();
 $('#pg').onclick=async e=>{const b=e.target.closest('button');if(!b||b.id==='add')return;const r=rows.find(x=>x.id===(b.dataset.e||b.dataset.d));if(!r)return;
  if(b.dataset.e)form(r);else if(confirm('Hapus pengguna ini?')){try{await DB.del('pengguna',r.id);await lg('Hapus','Pengguna',r.username);go('pengguna')}catch(x){toast('Gagal: '+x.message)}}}}
async function pgSet(){
 $('#pg').innerHTML=`<h2 style="margin-bottom:14px">Pengaturan</h2><div class="card" style="max-width:520px"><label class="lb">Nama Aplikasi<input id="nmapp" value="${esc(S.cfg.app)}"></label><label class="lb">Nama Instansi<input id="ins" value="${esc(S.cfg.instansi)}"></label><div class="lb">Logo Aplikasi<div class="row" style="margin-top:6px;flex-wrap:nowrap"><img id="lgp" src="${esc(S.cfg.logo)}" alt="" style="width:72px;height:72px;object-fit:contain;border:1px solid #E6ECF5;border-radius:12px;padding:4px;background:#fff;flex-shrink:0"><div style="flex:1;min-width:0"><input id="logo" type="file" accept="image/*"><button class="btn g s" id="lgr" style="margin-top:6px">Kembalikan logo bawaan</button></div></div></div><button class="btn" id="sv">Simpan</button></div>`;
 $('#logo').onchange=e=>{const f=e.target.files[0];if(f)$('#lgp').src=URL.createObjectURL(f)};
 $('#lgr').onclick=async()=>{try{await DB.setCfg('logo_url','');S.cfg.logo=LOGO;await lg('Ubah','Pengaturan','logo bawaan');toast('Logo bawaan dipulihkan');go('pengaturan')}catch(e){toast('Gagal: '+e.message)}};
 $('#sv').onclick=async()=>{try{const v=$('#ins').value.trim(),a=$('#nmapp').value.trim();if(!v||!a)throw new Error('Nama aplikasi dan nama instansi wajib diisi');
  const f=$('#logo').files[0];if(f){S.cfg.logo=await upLogo(f);await DB.setCfg('logo_url',S.cfg.logo)}
  await DB.setCfg('instansi',v);await DB.setCfg('nama_app',a);S.cfg.instansi=v;S.cfg.app=a;document.title=a;await lg('Ubah','Pengaturan','nama aplikasi, instansi & logo');toast('Tersimpan');go('pengaturan')}catch(e){toast('Gagal: '+e.message)}}}
async function pgLog(){
 const rows=(await DB.list('log_aktivitas')).slice(0,100);
 $('#pg').innerHTML=`<h2 style="margin-bottom:14px">Log Aktivitas</h2><div class="card">${tbl(['Waktu','Pengguna','Aksi','Modul','Detail'],rows.map(r=>`<tr><td>${esc((r.created_at||'').replace('T',' ').slice(0,16))}</td><td>${esc(r.pengguna)}</td><td>${esc(r.aksi)}</td><td>${esc(r.modul)}</td><td>${esc(r.detail)}</td></tr>`))}</div>`}
async function pgProf(){
 $('#pg').innerHTML=`<h2 style="margin-bottom:14px">Profil Pengguna</h2><div class="card" style="max-width:520px"><div class="row">${av(S.user,72)}<div><b style="font-size:16px">${esc(S.user.nama_lengkap||S.user.nama)}</b><br><small>${esc(S.user.unit_kerja||'-')}</small><br><small>Peran: ${S.user.role}${S.user.jabatan?' · '+esc(S.user.jabatan):''}</small></div></div><br><button class="btn g s" id="ep">Ubah Profil</button><hr style="margin:14px 0;border:0;border-top:1px solid #EEF2F8"><label class="lb">Password Baru<input id="np" type="password"></label><button class="btn" id="sv">Ubah Password</button></div>`;
 $('#sv').onclick=async()=>{try{const p=$('#np').value;if(p.length<6)throw new Error('Minimal 6 karakter');
  if(!IS_PREVIEW){if(S.user.auth){const{error}=await sb.auth.updateUser({password:p});if(error)throw error}else await DB.upd('pengguna',S.user.id,{password_hash:await sha(p)})}
  await lg('Ubah Password','Profil','');toast('Password diperbarui');$('#np').value=''}catch(e){toast('Gagal: '+e.message)}};
 $('#ep').onclick=()=>openForm('Ubah Profil',[{k:'nama_lengkap',l:'Nama Lengkap beserta Gelar'},{k:'unit_kerja',l:'Unit Kerja'},{k:'foto',l:'Foto Profil (JPG/PNG)',type:'file',acc:'image/*'}],S.user,async r=>{
  if(!r.nama_lengkap||!r.unit_kerja)throw new Error('Nama lengkap dan unit kerja wajib diisi');
  const d={nama_lengkap:r.nama_lengkap,unit_kerja:r.unit_kerja};if(r.foto)d.foto_url=await upFoto(r.foto);
  if(!IS_PREVIEW){if(S.user.auth){const{error}=await sb.auth.updateUser({data:{...d,foto_url:d.foto_url||S.user.foto_url||''}});if(error)throw error}else await DB.upd('pengguna',S.user.id,d)}
  Object.assign(S.user,d);await lg('Ubah Profil','Profil','');toast('Profil diperbarui');go('profil')})}
// ===== LOGIN =====
function loginView(){
 $('#app').innerHTML=`<div class="lg"><div class="card glass" style="width:100%;max-width:380px;text-align:center"><img src="${esc(S.cfg.logo)}" style="width:150px;margin-bottom:14px" alt="SITARA FIKES"><input id="lu" placeholder="Username atau email Admin"><input id="lp" type="password" placeholder="Password"><button class="btn" id="lb" style="width:100%">Masuk</button>
 ${IS_PREVIEW?`<p style="margin:14px 0 6px"><span class="chip">Mode Preview Aktif</span></p><small>Quick Login:</small><div class="row" style="justify-content:center;margin-top:6px">${['admin','staf','prodi','pimpinan'].map(r=>`<button class="btn g s" data-q="${r}">${r}</button>`).join('')}</div>`:''}</div></div>`;
 $('#lb').onclick=doLogin;$('#lp').onkeydown=e=>{if(e.key==='Enter')doLogin()};
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.user={id:'p',nama:'Demo '+b.dataset.q,nama_lengkap:'Demo '+b.dataset.q+', S.Kep., M.Kes.',unit_kerja:'Fakultas Ilmu Kesehatan',role:b.dataset.q,jabatan:''};start()})}
async function doLogin(){
 const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return toast('Isi username dan password');
 if(IS_PREVIEW)return toast('Gunakan tombol Quick Login');
 try{
  if(u.includes('@')){const{data,error}=await sb.auth.signInWithPassword({email:u,password:p});if(error)throw error;S.user={...(data.user.user_metadata||{}),nama:data.user.email,role:'admin',auth:true}}
  else{const{data,error}=await sb.from('pengguna').select('*').eq('username',u).eq('password_hash',await sha(p)).eq('aktif',true).maybeSingle();if(error)throw error;if(!data)throw new Error('Username atau password salah');S.user=data}
  await lg('Login','Auth','');start()}catch(e){toast(e.message||'Login gagal')}}
async function logout(){try{if(!IS_PREVIEW&&S.user.auth)await sb.auth.signOut()}catch(e){}S.user=null;loginView()}
const upLogo=f=>IS_PREVIEW?new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}):up(f);
async function loadCfg(){try{const l=await DB.list('pengaturan'),g=k=>(l.find(x=>x.key===k)||{}).value;if(g('instansi'))S.cfg.instansi=g('instansi');if(g('nama_app'))S.cfg.app=g('nama_app');if(g('logo_url'))S.cfg.logo=g('logo_url');document.title=S.cfg.app}catch(e){}}
async function start(){await loadCfg();go('dashboard')}
function fitName(){const e=$('#pn');if(!e)return;let s=14;e.style.fontSize=s+'px';while(e.scrollWidth>e.clientWidth&&s>8){s-=.5;e.style.fontSize=s+'px'}}
function tick(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(/\./g,':')}
setInterval(tick,1000);addEventListener('resize',fitName);
function xlsx(of,bl,y){
 const jt=t=>MODS[t].t,fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
 const rk=[['LAPORAN ARSIP DIGITAL '+S.cfg.app.toUpperCase()],[S.cfg.instansi],['Tahun '+y],[],['Jenis Dokumen',...bl,'Total']];
 Object.keys(MODS).forEach(t=>{const c=bl.map((_,i)=>of.filter(r=>r._t===t&&+r.tanggal.slice(5,7)===i+1).length);rk.push([jt(t),...c,c.reduce((a,b)=>a+b,0)])});
 rk.push(['Total',...bl.map((_,i)=>of.filter(r=>+r.tanggal.slice(5,7)===i+1).length),of.length]);
 const dk=[['DAFTAR DOKUMEN TAHUN '+y],[],['No','Jenis Dokumen','Nomor','Tanggal','Pihak','Perihal / Tentang']];
 [...of].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).forEach((r,i)=>dk.push([i+1,jt(r._t),r.nomor,fd(r.tanggal),r.pihak||'',r.perihal||'']));
 const w1=XLSX.utils.aoa_to_sheet(rk),w2=XLSX.utils.aoa_to_sheet(dk);
 w1['!cols']=[{wch:26},...bl.map(()=>({wch:6})),{wch:8}];w1['!merges']=[0,1,2].map(r=>({s:{r,c:0},e:{r,c:13}}));
 w2['!cols']=[{wch:5},{wch:24},{wch:26},{wch:18},{wch:28},{wch:46}];w2['!merges']=[{s:{r:0,c:0},e:{r:0,c:5}}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,'Rekap Bulanan');XLSX.utils.book_append_sheet(wb,w2,'Daftar Dokumen');
 XLSX.writeFile(wb,`Laporan-${S.cfg.app.replace(/\W+/g,'-')}-${y}.xlsx`)}
// ===== PWA (service worker dibuat dari Blob) =====
try{if('serviceWorker'in navigator){const sw="self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('fetch',()=>{});";navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{})}}catch(e){}
$('#app').addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p&&S.user)go(p.dataset.p)});
(async()=>{await loadCfg();if(!IS_PREVIEW){try{const{data}=await sb.auth.getSession();if(data.session){S.user={...(data.session.user.user_metadata||{}),nama:data.session.user.email,role:'admin',auth:true};return start()}}catch(e){}}loginView()})();
</script></body></html>
